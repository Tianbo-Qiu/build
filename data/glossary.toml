# Short definitions shown when a reader hovers or focuses a term.
# Use one in a note with {{< term kubelet >}} or {{< term kubelet "Kubelet" >}}.
# All entries are listed on /glossary/. Set note to the page that explains
# the term in full, and the glossary links to it.

[kubelet]
name = 'kubelet'
note = '/k8s/architecture'
def = 'The agent that runs on each node in a Kubernetes cluster and makes sure the containers in its pods are running.'

[container-runtime]
name = 'container runtime'
def = 'The software on a node that runs containers. It pulls images and asks the kernel to set up each container.'

[node]
name = 'node'
note = '/k8s/architecture'
def = 'A machine, physical or virtual, that runs pods in a Kubernetes cluster.'

[pod]
name = 'pod'
note = '/k8s/deployment'
def = 'The smallest unit Kubernetes runs: one or more containers that run on the same node and share some resources, such as a network namespace.'

[apparmor]
name = 'AppArmor'
def = 'A Linux kernel security feature that limits what a program can do. A profile, matched to the program by its file path, lists the files, capabilities, and network access it may use.'

[selinux]
name = 'SELinux'
def = 'A Linux kernel security feature, first developed by the NSA, that labels every process and resource. An access is allowed only if the policy permits that pair of labels.'

[kubectl]
name = 'kubectl'
def = 'The command-line tool for working with a Kubernetes cluster. It sends requests to the API server.'

[service]
name = 'Service'
note = '/k8s/service'
def = 'A Kubernetes object that gives a set of pods one stable network address and spreads traffic among them.'

[deployment]
name = 'Deployment'
note = '/k8s/deployment'
def = 'A Kubernetes object that keeps a chosen number of identical pods running and replaces them gradually when you change them.'

[replicaset]
name = 'ReplicaSet'
note = '/k8s/deployment'
def = 'A Kubernetes object that keeps a chosen number of identical pods running. Deployments create and manage ReplicaSets.'

[kubeadm]
name = 'kubeadm'
note = '/k8s/local-clusters'
def = 'A Kubernetes tool that sets up a cluster: it starts the control plane on one machine and joins other machines to it as nodes.'

[static-pod]
name = 'static pod'
note = '/k8s/local-clusters'
def = 'A pod that the kubelet starts from a manifest file on its node, without the API server. kubeadm runs the control plane this way.'

[kubeconfig]
name = 'kubeconfig'
note = '/k8s/local-clusters'
def = 'A file that tells kubectl which clusters exist, how to reach and trust their API servers, and which credentials to use.'

[k8s-namespace]
name = 'namespace (Kubernetes)'
def = 'A named group of objects inside a Kubernetes cluster, used to keep teams or apps apart. Unrelated to Linux namespaces.'

[cloud-controller-manager]
name = 'cloud-controller-manager'
note = '/k8s/managed-clusters'
def = 'An optional control plane component that connects a cluster to a cloud provider, for example to create load balancers and to track the virtual machines behind nodes.'

[api-server]
name = 'API server'
note = '/k8s/architecture'
def = 'The control plane component that serves the Kubernetes API. Every other component, and every tool such as kubectl, reads and changes cluster state only through it.'

[etcd]
name = 'etcd'
note = '/k8s/architecture'
def = 'A consistent, highly available key-value store that Kubernetes uses to keep all cluster data. Only the API server talks to it.'

[scheduler]
name = 'scheduler'
note = '/k8s/architecture'
def = 'The control plane component that watches for new pods with no node assigned and picks a node for each one to run on.'

[controller]
name = 'controller'
note = '/k8s/architecture'
def = 'A control loop that watches the cluster through the API server and makes or requests changes to move its current state toward the desired state.'

[controller-manager]
name = 'controller manager'
note = '/k8s/architecture'
def = 'The control plane component that runs the built-in controllers, such as the Deployment and ReplicaSet controllers, in one process.'

[label]
name = 'label'
def = 'A key-value pair, such as app=web, attached to a Kubernetes object to identify it. A label selector uses labels to pick out a set of objects, such as the pods a ReplicaSet counts as its own.'

[volume]
name = 'volume'
def = 'A directory of data that the containers in a pod can access. Its data survives when a container in the pod restarts.'

[container-image]
name = 'container image'
def = 'A package of the files and settings a container starts from, named like nginx:1.27 and stored in a registry such as Docker Hub.'

[kube-proxy]
name = 'kube-proxy'
note = '/k8s/service'
def = 'A process on each node that watches Services and EndpointSlices and writes kernel rules, such as iptables rules, that send traffic for a Service to one of its pods.'

[cluster-dns]
name = 'cluster DNS'
note = '/k8s/service'
def = 'The DNS server inside a Kubernetes cluster, usually CoreDNS. It answers lookups of Service names, such as web.default.svc.cluster.local, and pods use it by default.'

[endpointslice]
name = 'EndpointSlice'
note = '/k8s/service'
def = 'A Kubernetes object that lists the IP addresses and ports of the pods behind a Service, each marked ready or not. A controller keeps it in step with the Service selector.'

[readiness-probe]
name = 'readiness probe'
note = '/k8s/service'
def = 'A check the kubelet runs on a container, such as an HTTP request, to decide whether its pod is ready to receive traffic from Services.'

[llm]
name = 'large language model (LLM)'
note = '/ai/llm'
def = 'A neural network trained on a very large amount of text to predict the next token from the tokens before it. It writes by repeating that prediction one token at a time.'

[token]
name = 'token'
note = '/ai/llm'
def = 'The unit of text a language model reads and writes, often a word or part of a word. Context limits and API prices are counted in tokens.'

[context-window]
name = 'context window'
note = '/ai/llm'
def = 'The most tokens a language model can take in at once, prompt and reply together.'

[hallucination]
name = 'hallucination'
note = '/ai/llm'
def = 'A fluent statement from a language model that is false. Models produce likely text and do not look facts up.'

[rubric]
name = 'rubric'
note = '/ai/evals'
def = 'A written list of criteria that an output is graded against, such as "the chart has a title". Each criterion is often passed or failed, and the passes are added up.'

[tool-use]
name = 'tool use'
note = '/ai/tool-use'
def = 'A way for an LLM to ask the application around it to run a named function with given arguments, and to read the result. Also called function calling.'

[mcp]
name = 'MCP'
note = '/ai/tool-use'
def = 'Model Context Protocol: an open standard, published by Anthropic in November 2024, that lets one program, an MCP server, offer tools to any application that speaks it, over JSON-RPC.'

[prompt-injection]
name = 'prompt injection'
note = '/ai/tool-use'
def = "An attack that hides instructions in text an LLM reads, such as a web page or a tool result, so that the model follows them instead of its application's instructions."

[reflection]
name = 'reflection'
note = '/ai/agentic-patterns'
def = 'An agentic pattern in which an LLM critiques an output, often its own draft, and then revises it, over one or more rounds.'

[chain-of-thought]
name = 'chain-of-thought'
note = '/ai/prompting'
def = 'A prompting technique in which the model writes out intermediate reasoning steps before its answer, which improves results on multi-step problems.'

[eval]
name = 'eval'
note = '/ai/evals'
def = 'A fixed set of test inputs run through an LLM application, with a way to score each output, so that versions of the application can be compared.'

[llm-as-a-judge]
name = 'LLM-as-a-judge'
note = '/ai/evals'
def = 'Using an LLM to grade outputs, such as against a rubric or by comparing two answers. Judges have known biases, such as favoring the first or the longer answer.'

[network-namespace]
name = 'network namespace'
note = '/k8s/container/namespace'
def = 'A Linux namespace that gives a group of processes their own network interfaces, IP addresses, routes, and ports. The containers in a pod share one.'

[sidecar-container]
name = 'sidecar container'
note = '/k8s/sidecar'
def = "A helper container in a pod that runs beside the main application for the pod's whole life, adding a feature such as log shipping or a proxy."

[init-container]
name = 'init container'
def = 'A container in a pod that runs to completion before the app containers start, for setup work such as waiting for a dependency.'

[ephemeral-container]
name = 'ephemeral container'
note = '/k8s/kubectl-debug'
def = 'A container added to a running pod for troubleshooting, usually with kubectl debug. It is never restarted and stays in the pod until the pod is deleted.'

[network-policy]
name = 'NetworkPolicy'
note = '/k8s/network-model'
def = 'A Kubernetes object that limits which traffic may reach or leave selected pods. The network plugin enforces it; a plugin without support ignores it.'

[cni-plugin]
name = 'CNI plugin'
note = '/k8s/network-model'
def = "A program, called through the Container Network Interface, that connects a new pod's network namespace to the cluster network and gives the pod its IP address, such as Calico, Cilium, or Flannel."

[service-mesh]
name = 'service mesh'
note = '/k8s/sidecar'
def = 'A layer of proxies, often one sidecar per pod, that carries the traffic between services and adds encryption, retries, and metrics. Istio is one.'

[osi-model]
name = 'OSI model'
note = '/networking/basics'
def = 'A seven-layer reference model of networking from ISO, from the physical layer up to the application layer. Names such as "layer 2" and "layer 7" come from it.'

[bandwidth]
name = 'bandwidth'
note = '/networking/basics'
def = 'How much data a link can carry per second, measured in bits per second.'

[latency]
name = 'latency'
note = '/networking/basics'
def = "The time data takes to get from sender to receiver. It decides how long small transfers take, and more bandwidth doesn't lower it."

[rtt]
name = 'RTT'
note = '/networking/basics'
def = 'Round-trip time: the time for data to reach the other end and a reply to come back. Each request that waits for a reply costs at least one.'

[tcp]
name = 'TCP'
def = 'Transmission Control Protocol: the transport protocol that gives two programs a reliable, ordered stream of bytes over IP, on a connection opened with a handshake.'

[ip-address]
name = 'IP address'
note = '/networking/basics'
def = "The address that names a host's network interface across networks: 32 bits in IPv4, such as 10.244.2.5, and 128 bits in IPv6."

[port]
name = 'port'
note = '/networking/basics'
def = 'A 16-bit number that names an endpoint inside a host, so that many programs can share one IP address. Servers listen on known ports, such as 80 for HTTP.'

[mtu]
name = 'MTU'
note = '/networking/basics'
def = 'Maximum transmission unit: the largest payload one frame on a link can carry, 1,500 bytes on standard Ethernet.'

[nat]
name = 'NAT'
def = 'Network address translation: rewriting the IP addresses, and often the ports, of packets as they pass a router, such as to share one public address among many hosts.'
