# Short definitions shown when a reader hovers or focuses a term.
# Use one in a note with {{< term kubelet >}} or {{< term kubelet "Kubelet" >}}.
# All entries are listed on /glossary/. Set note to the page that explains
# the term in full, and the glossary links to it.

[kubelet]
name = 'kubelet'
note = '/k8s/architecture'
def = 'The agent that runs on each node in a Kubernetes cluster and makes sure the containers in its pods are running.'

[container-runtime]
name = 'container runtime'
def = 'The software on a node that runs containers. It pulls images and asks the kernel to set up each container.'

[node]
name = 'node'
note = '/k8s/architecture'
def = 'A machine, physical or virtual, that runs pods in a Kubernetes cluster.'

[pod]
name = 'pod'
def = 'The smallest unit Kubernetes runs: one or more containers that run on the same node and share some resources, such as a network namespace.'

[apparmor]
name = 'AppArmor'
def = 'A Linux kernel security feature that limits what a program can do. A profile, matched to the program by its file path, lists the files, capabilities, and network access it may use.'

[selinux]
name = 'SELinux'
def = 'A Linux kernel security feature, first developed by the NSA, that labels every process and resource. An access is allowed only if the policy permits that pair of labels.'

[kubectl]
name = 'kubectl'
def = 'The command-line tool for working with a Kubernetes cluster. It sends requests to the API server.'

[service]
name = 'Service'
def = 'A Kubernetes object that gives a set of pods one stable network address and spreads traffic among them.'

[deployment]
name = 'Deployment'
def = 'A Kubernetes object that keeps a chosen number of identical pods running and replaces them gradually when you change them.'

[replicaset]
name = 'ReplicaSet'
def = 'A Kubernetes object that keeps a chosen number of identical pods running. Deployments create and manage ReplicaSets.'

[kubeadm]
name = 'kubeadm'
note = '/k8s/local-clusters'
def = 'A Kubernetes tool that sets up a cluster: it starts the control plane on one machine and joins other machines to it as nodes.'

[static-pod]
name = 'static pod'
note = '/k8s/local-clusters'
def = 'A pod that the kubelet starts from a manifest file on its node, without the API server. kubeadm runs the control plane this way.'

[kubeconfig]
name = 'kubeconfig'
note = '/k8s/local-clusters'
def = 'A file that tells kubectl which clusters exist, how to reach and trust their API servers, and which credentials to use.'

[k8s-namespace]
name = 'namespace (Kubernetes)'
def = 'A named group of objects inside a Kubernetes cluster, used to keep teams or apps apart. Unrelated to Linux namespaces.'

[cloud-controller-manager]
name = 'cloud-controller-manager'
note = '/k8s/managed-clusters'
def = 'An optional control plane component that connects a cluster to a cloud provider, for example to create load balancers and to track the virtual machines behind nodes.'
