# Short definitions shown when a reader hovers or focuses a term.
# Use one in a note with {{< term kubelet >}} or {{< term kubelet "Kubelet" >}}.
# All entries are listed on /glossary/. Set note to the page that explains
# the term in full, and the glossary links to it.

[kubelet]
name = 'kubelet'
note = '/k8s/architecture'
def = 'The agent that runs on each node in a Kubernetes cluster and makes sure the containers in its pods are running.'

[container-runtime]
name = 'container runtime'
def = 'The software on a node that runs containers. It pulls images and asks the kernel to set up each container.'

[node]
name = 'node'
note = '/k8s/architecture'
def = 'A machine, physical or virtual, that runs pods in a Kubernetes cluster.'

[pod]
name = 'pod'
note = '/k8s/deployment'
def = 'The smallest unit Kubernetes runs: one or more containers that run on the same node and share some resources, such as a network namespace.'

[apparmor]
name = 'AppArmor'
def = 'A Linux kernel security feature that limits what a program can do. A profile, matched to the program by its file path, lists the files, capabilities, and network access it may use.'

[selinux]
name = 'SELinux'
def = 'A Linux kernel security feature, first developed by the NSA, that labels every process and resource. An access is allowed only if the policy permits that pair of labels.'

[kubectl]
name = 'kubectl'
def = 'The command-line tool for working with a Kubernetes cluster. It sends requests to the API server.'

[service]
name = 'Service'
note = '/k8s/service'
def = 'A Kubernetes object that gives a set of pods one stable network address and spreads traffic among them.'

[deployment]
name = 'Deployment'
note = '/k8s/deployment'
def = 'A Kubernetes object that keeps a chosen number of identical pods running and replaces them gradually when you change them.'

[replicaset]
name = 'ReplicaSet'
note = '/k8s/deployment'
def = 'A Kubernetes object that keeps a chosen number of identical pods running. Deployments create and manage ReplicaSets.'

[kubeadm]
name = 'kubeadm'
note = '/k8s/local-clusters'
def = 'A Kubernetes tool that sets up a cluster: it starts the control plane on one machine and joins other machines to it as nodes.'

[static-pod]
name = 'static pod'
note = '/k8s/local-clusters'
def = 'A pod that the kubelet starts from a manifest file on its node, without the API server. kubeadm runs the control plane this way.'

[kubeconfig]
name = 'kubeconfig'
note = '/k8s/local-clusters'
def = 'A file that tells kubectl which clusters exist, how to reach and trust their API servers, and which credentials to use.'

[k8s-namespace]
name = 'namespace (Kubernetes)'
def = 'A named group of objects inside a Kubernetes cluster, used to keep teams or apps apart. Unrelated to Linux namespaces.'

[cloud-controller-manager]
name = 'cloud-controller-manager'
note = '/k8s/managed-clusters'
def = 'An optional control plane component that connects a cluster to a cloud provider, for example to create load balancers and to track the virtual machines behind nodes.'

[api-server]
name = 'API server'
note = '/k8s/architecture'
def = 'The control plane component that serves the Kubernetes API. Every other component, and every tool such as kubectl, reads and changes cluster state only through it.'

[etcd]
name = 'etcd'
note = '/k8s/architecture'
def = 'A consistent, highly available key-value store that Kubernetes uses to keep all cluster data. Only the API server talks to it.'

[scheduler]
name = 'scheduler'
note = '/k8s/architecture'
def = 'The control plane component that watches for new pods with no node assigned and picks a node for each one to run on.'

[controller]
name = 'controller'
note = '/k8s/architecture'
def = 'A control loop that watches the cluster through the API server and makes or requests changes to move its current state toward the desired state.'

[controller-manager]
name = 'controller manager'
note = '/k8s/architecture'
def = 'The control plane component that runs the built-in controllers, such as the Deployment and ReplicaSet controllers, in one process.'

[label]
name = 'label'
def = 'A key-value pair, such as app=web, attached to a Kubernetes object to identify it. A label selector uses labels to pick out a set of objects, such as the pods a ReplicaSet counts as its own.'

[volume]
name = 'volume'
def = 'A directory of data that the containers in a pod can access. Its data survives when a container in the pod restarts.'

[container-image]
name = 'container image'
def = 'A package of the files and settings a container starts from, named like nginx:1.27 and stored in a registry such as Docker Hub.'

[kube-proxy]
name = 'kube-proxy'
note = '/k8s/service'
def = 'A process on each node that watches Services and EndpointSlices and writes kernel rules, such as iptables rules, that send traffic for a Service to one of its pods.'

[cluster-dns]
name = 'cluster DNS'
note = '/k8s/service'
def = 'The DNS server inside a Kubernetes cluster, usually CoreDNS. It answers lookups of Service names, such as web.default.svc.cluster.local, and pods use it by default.'

[endpointslice]
name = 'EndpointSlice'
note = '/k8s/service'
def = 'A Kubernetes object that lists the IP addresses and ports of the pods behind a Service, each marked ready or not. A controller keeps it in step with the Service selector.'

[readiness-probe]
name = 'readiness probe'
note = '/k8s/service'
def = 'A check the kubelet runs on a container, such as an HTTP request, to decide whether its pod is ready to receive traffic from Services.'

[llm]
name = 'large language model (LLM)'
note = '/ai/llm'
def = 'A neural network trained on a very large amount of text to predict the next token from the tokens before it. It writes by repeating that prediction one token at a time.'

[token]
name = 'token'
note = '/ai/llm'
def = 'The unit of text a language model reads and writes, often a word or part of a word. Context limits and API prices are counted in tokens.'

[context-window]
name = 'context window'
note = '/ai/llm'
def = 'The most tokens a language model can take in at once, prompt and reply together.'

[hallucination]
name = 'hallucination'
note = '/ai/llm'
def = 'A fluent statement from a language model that is false. Models produce likely text and do not look facts up.'
