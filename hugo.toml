baseURL = '/'
locale = 'en-us'
title = 'Build'
disableKinds = ['taxonomy', 'term']

# Diagram sources; only the rendered .svg is published.
ignoreFiles = ['\.d2$']

# Updated dates come from each file's last git commit.
enableGitInfo = true

[frontmatter]
  lastmod = [':git', 'lastmod', ':fileModTime']

[markup.highlight]
  noClasses = false
